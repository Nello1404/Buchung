<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" role="img" aria-label="FlySpot Valet">
  <defs>
    <linearGradient id="fsGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6cf97"/>
      <stop offset="0.55" stop-color="#c8a45c"/>
      <stop offset="1" stop-color="#9c7c38"/>
    </linearGradient>
    <linearGradient id="fsSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/>
      <stop offset="0.6" stop-color="#c7ccd4"/>
      <stop offset="1" stop-color="#8f96a1"/>
    </linearGradient>
  </defs>

  <!-- Emblem: Ring + FS-Monogramm + startendes Flugzeug -->
  <g transform="translate(4 4)">
    <circle cx="32" cy="32" r="30" fill="none" stroke="url(#fsGold)" stroke-width="2.4"/>
    <!-- F -->
    <path d="M20 18 h15 v5 h-9.5 v6 h8 v5 h-8 v12 h-5.5 z" fill="url(#fsGold)"/>
    <!-- S -->
    <path d="M46.5 18.5 c-7 0 -9.5 3.6 -9.5 8 c0 4.4 3.2 6 7.5 6.6 c3 0.4 3.8 1 3.8 2.4 c0 1.4 -1.2 2.2 -3.6 2.2 c-3 0 -5.2 -1 -6.9 -2.6 l0 6.1 c1.9 1.3 4.4 2 7.3 2 c6.8 0 9.6 -3.4 9.6 -8 c0 -4.6 -3.4 -6.1 -7.7 -6.7 c-2.9 -0.4 -3.6 -1 -3.6 -2.3 c0 -1.3 1.1 -2.1 3.2 -2.1 c2.6 0 4.7 0.9 6.3 2.3 l0 -6 c-1.7 -1.2 -3.9 -1.9 -6.4 -1.9 z" fill="url(#fsSilver)"/>
    <!-- Flugzeug -->
    <path d="M40 12 l10 -4 l-3 5 l7.5 1.5 l-2.5 2.5 l-9 -1.2 l-5 3.4 l0.5 -3.9 z" fill="url(#fsSilver)"/>
    <!-- Sportwagen-Silhouette -->
    <path d="M12 47 c4 -5 9 -6.5 15 -6.5 c5 0 8 1.5 11 4 c3.5 0 6.5 0.6 9 2 c-1 1.8 -3 2.6 -5.5 2.6 c-0.1 1.7 -1.5 3 -3.2 3 c-1.7 0 -3.1 -1.3 -3.2 -3 h-9.6 c-0.1 1.7 -1.5 3 -3.2 3 c-1.7 0 -3.1 -1.3 -3.2 -3 c-2 -0.1 -3.4 -0.6 -4.4 -1.6 z" fill="url(#fsGold)" opacity="0.9"/>
  </g>

  <!-- Wortmarke -->
  <g transform="translate(76 0)">
    <text x="0" y="34" font-family="'Playfair Display', Georgia, serif" font-size="27" font-weight="700" letter-spacing="1">
      <tspan fill="url(#fsGold)">FLY</tspan><tspan fill="url(#fsSilver)">SPOT</tspan>
    </text>
    <text x="1" y="55" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="7" fill="url(#fsGold)">VALET</text>
  </g>
</svg>
